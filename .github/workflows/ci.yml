name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ es el mínimo que importa los .ts de shared/ sin flag
          # (npm test depende de eso). Con "22" esto depende de cuál sea la
          # última 22.x del día.
          node-version: '>=22.18'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck del cliente
        run: npm run lint

      - name: Typecheck del Worker
        run: npm run lint:worker

      # Lógica pura (clamp de fin de mes, tarifas, caducidad). Corre sin
      # servidor: importa los .ts de shared/ con el type stripping de Node.
      - name: Tests unitarios
        run: npm test

      # El esquema se aplica contra una D1 local efímera (miniflare), sin
      # credenciales de Cloudflare. Si el SQL tiene un error de sintaxis o una
      # tabla/index faltante, falla acá.
      - name: Aplicar migraciones en una D1 local
        run: npm run db:migrate:local

      - name: Build
        run: npm run build

      # El smoke test end-to-end (scripts/smoke.mjs) necesita el server de dev
      # levantado; se corre a mano con `npm run dev` + `npm run smoke`.